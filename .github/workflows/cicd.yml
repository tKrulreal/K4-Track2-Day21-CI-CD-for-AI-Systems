name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Pull data with DVC
        run: dvc pull

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1=$(python -c "import json; print(json.load(open('outputs/report.json'))['f1_score'])")
          echo "f1=$f1" >> $GITHUB_OUTPUT

      - name: Upload model to S3
        run: aws s3 cp models/model.joblib s3://${{ secrets.ARTIFACT_BUCKET }}/artifacts/current/model.joblib

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: outputs/report.json

  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate
        run: |
          python - <<'PYEOF'
          import os
          f1 = float(os.environ['F1'])
          threshold = 0.65
          if f1 < threshold:
              print(f"F1={f1:.4f} is below threshold {threshold}. Pipeline blocked.")
              exit(1)
          print(f"F1={f1:.4f} >= {threshold}. Quality gate passed!")
          PYEOF
        env:
          F1: ${{ needs.train.outputs.f1 }}

  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 10
            curl -f http://localhost:8080/healthz || exit 1
